spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# ===================================================================
# JWT CONFIGURATION
# ===================================================================
app.jwt.secret=${APP_JWT_SECRET:d2ViYXBwLXJlYWN0LXZpdGUtc3ByaW5nLWJvb3QtdG9rZW4tc2VjcmV0LWtleS0xMjM0NTY3OA==}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ===================================================================
# DATABASE CONFIGURATION - H2 (Development)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:campusone}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}

# ===================================================================
# MySQL Database (Production) - Uncomment and configure
# ===================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/campusone?useSSL=false&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=password
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update

# ===================================================================
# HIKARI CONNECTION POOL
# ===================================================================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ===================================================================
# CORS CONFIGURATION
# ===================================================================
app.cors.origins=${APP_CORS_ORIGINS:*}

# ===================================================================
# FILE UPLOAD
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# ===================================================================
# EMAIL CONFIGURATION
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Login URL for email notifications
app.login.url=${APP_LOGIN_URL:http://localhost:5173/login}

# ===================================================================
# LOGGING
# ===================================================================
logging.level.com.campusone=INFO
logging.level.org.springframework.security=INFO
